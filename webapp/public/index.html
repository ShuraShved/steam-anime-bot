<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release radar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--tg-theme-bg-color, #fff);
  color: var(--tg-theme-text-color, #000);
}
.header-container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.header-container h1 {
  margin: 0;
}
h1 { font-size: 20px; margin: 0 0 20px; }
#favorites {
    display: none;
    background-color: #1c1c1e;
    color: #ffffff;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 16px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    transition: transform 0.1s ease, opacity 0.2s ease;
}
#favorites:active {
  transform: scale(0.95);
  opacity: 0.8;
}
h2 { font-size: 17px; margin: 0 0 8px; }
#datePicker {
  width: 100%; padding: 10px 12px; font-size: 16px;
  border: 1px solid var(--tg-theme-hint-color, #999); border-radius: 10px;
  background: var(--tg-theme-secondary-bg-color, #f2f2f7);
  color: inherit;
}
#status { margin: 12px 0 0; color: var(--tg-theme-hint-color, #8a8a8e); }
.apps {
    list-style: none;
    margin: 16px 0 0;
    padding: 0;
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}

/* drops from the top, bounces slightly, settles; cards stagger via --i */
@keyframes dropBounce {
  0%   { opacity: 0; transform: translateY(-40px); }
  70%  { opacity: 1; transform: translateY(5px); }
  100% { opacity: 1; transform: translateY(0); }
}
.card {
  background: var(--tg-theme-secondary-bg-color, #f2f2f7);
  border-radius: 12px; overflow: hidden;
  animation: dropBounce 0.5s ease-out both;
  animation-delay: calc(var(--i, 0) * 50ms);
}
.card img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 460 / 215;
    background-color: rgba(128, 128, 128, 0.2);
    object-fit: cover;
}
.card-body { display: flex; align-items: center; gap: 8px; padding: 10px; }
.card-info { flex: 1; min-width: 0; }
.card-title { font-weight: 600; color: inherit; text-decoration: none; overflow-wrap: anywhere; }
.card-meta { margin-top: 2px; font-size: 13px; color: var(--tg-theme-hint-color, #8a8a8e); }
.star {
  font-size: 28px; line-height: 1; padding: 4px; cursor: pointer;
  background: none; border: 0; color: var(--tg-theme-hint-color, #8a8a8e);
}
.star[aria-pressed="true"] { color: gold; }
.star:disabled { opacity: 0.5; }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
<div class="header-container">
    <h1 id="greeting">Loading…</h1>
    <button onclick="loadFavorites()" id="favorites">My faves 🌟</button>
</div>

<h2>Release radar</h2>
<input type="date" id="datePicker">
<p id="status" role="status"></p>
<ul class="apps" id="appsList"></ul>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const greeting = document.getElementById("greeting");
const favorites = document.getElementById("favorites");
const datePicker = document.getElementById("datePicker");
const statusEl = document.getElementById("status");
const appsList = document.getElementById("appsList");

// fetch wrapper: always sends the signed initData, throws on HTTP errors
async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "X-Init-Data": tg.initData, ...(options.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

const isHttp = (url) => /^https?:\/\//i.test(url || "");

function setStar(btn, on) {
  btn.textContent = on ? "★" : "☆";
  btn.setAttribute("aria-pressed", String(on));
  btn.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
}

async function toggleFavorite(app, btn) {
  const next = !app.is_favorite;
  setStar(btn, next);            // optimistic update
  btn.disabled = true;
  try {
    await api("/api/favorite", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: app.id, favorite: next }),
    });
    app.is_favorite = next;
    tg.HapticFeedback?.impactOccurred("light");
  } catch (err) {
    setStar(btn, app.is_favorite);   // roll back
    tg.showAlert(err.message);
  } finally {
    btn.disabled = false;
  }
}

// Built with DOM methods + textContent (no innerHTML): titles come from the DB.
function renderApp(app, index) {
  const li = document.createElement("li");
  li.className = "card";
  li.style.setProperty("--i", Math.min(index, 10));

  if (app.image) {
    const img = document.createElement("img");
    img.src = app.image;
    img.alt = "";
    img.loading = "lazy";
    img.addEventListener("error", () => img.remove());
    li.append(img);
  }

  const title = document.createElement(isHttp(app.link) ? "a" : "span");
  title.className = "card-title";
  title.textContent = app.title;
  if (isHttp(app.link)) {
    title.href = app.link;
    title.addEventListener("click", (e) => { e.preventDefault(); tg.openLink(app.link); });
  }

  const meta = document.createElement("div");
  meta.className = "card-meta";
  meta.textContent = [app.type, app.genres, app.price].filter(Boolean).join(" · ");

  const info = document.createElement("div");
  info.className = "card-info";
  info.append(title, meta);

  const star = document.createElement("button");
  star.type = "button";
  star.className = "star";
  setStar(star, app.is_favorite);
  star.addEventListener("click", () => toggleFavorite(app, star));

  const body = document.createElement("div");
  body.className = "card-body";
  body.append(info, star);
  li.append(body);
  return li;
}

let controller;   // lets a newer date selection cancel the older request
async function loadApps(date) {
  controller?.abort();
  controller = new AbortController();
  statusEl.textContent = "Loading…";
  appsList.replaceChildren();
  try {
    const { apps } = await api(`/api/apps?date=${encodeURIComponent(date)}`, { signal: controller.signal });
    statusEl.textContent = apps.length ? "" : "No releases on this date.";
    appsList.replaceChildren(...apps.map(renderApp));
  } catch (err) {
    if (err.name === "AbortError") return;
    statusEl.textContent = err.message;
  }
}

function todayISO() {   // local date, not UTC
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

api("/api/hello")
  .then((d) => { greeting.textContent = d.greeting; favorites.style.display = "block" })
  .catch((e) => { greeting.textContent = e.message; });

async function loadFavorites() {
    controller?.abort();
    controller = new AbortController();
    statusEl.textContent = "Loading…";
    appsList.replaceChildren();
    try {
    const { favorites } = await api(`/api/favorite`, { method: 'GET', signal: controller.signal });
    statusEl.textContent = apps.length ? "" : "No favorites.";
    appsList.replaceChildren(...apps.map(renderApp));
    } catch (err) {
    if (err.name === "AbortError") return;
    statusEl.textContent = err.message;
    }
}

datePicker.value = todayISO();
datePicker.addEventListener("change", () => datePicker.value && loadApps(datePicker.value));
loadApps(datePicker.value);
</script>
</body>
</html>
